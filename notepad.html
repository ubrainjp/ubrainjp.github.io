<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動保存メモ帳</title>
    <style>
        /* 画面全体のレイアウト設定 */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
            background-color: #f9f9f9;
        }

        /* タブバーのスタイル */
        .tab-bar {
            display: flex;
            background-color: #eaeaea;
            border-bottom: 1px solid #ccc;
            overflow-x: auto; /* 画面が狭いときは横スクロール可能に */
            white-space: nowrap;
        }

        /* 各タブボタンのスタイル */
        .tab-button {
            flex: 1;
            min-width: 70px;
            padding: 12px 5px;
            border: none;
            background-color: #eaeaea;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            color: #555;
            border-right: 1px solid #ccc;
            transition: background-color 0.15s;
        }

        .tab-button:last-child {
            border-right: none;
        }

        .tab-button:hover {
            background-color: #dfdfdf;
        }

        /* アクティブ（現在選択中）なタブのスタイル */
        .tab-button.active {
            background-color: #ffffff;
            color: #000;
            font-weight: bold;
            border-bottom: 3px solid #0076ff; /* 青い下線 */
        }

        /* テキストエリアのコンテナ */
        .textarea-container {
            flex: 1;
        }

        textarea {
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            border: none;
            resize: none;
            outline: none;
            font-size: 16px;
            line-height: 1.6;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div class="tab-bar">
        <button class="tab-button" data-tab="1">メモ 1</button>
        <button class="tab-button" data-tab="2">メモ 2</button>
        <button class="tab-button" data-tab="3">メモ 3</button>
        <button class="tab-button" data-tab="4">メモ 4</button>
        <button class="tab-button" data-tab="5">メモ 5</button>
        <button class="tab-button" data-tab="6">メモ 6</button>
        <button class="tab-button" data-tab="7">メモ 7</button>
        <button class="tab-button" data-tab="8">メモ 8</button>
        <button class="tab-button" data-tab="9">メモ 9</button>
        <button class="tab-button" data-tab="10">メモ 10</button>
    </div>

    <div class="textarea-container">
        <textarea id="notepad" placeholder="ここに文字を入力してください。自動的に保存されます..."></textarea>
    </div>

    <script>
        const textarea = document.getElementById('notepad');
        const tabButtons = document.querySelectorAll('.tab-button');
        
        // ローカルストレージ用のキーのプレフィックス
        const STORAGE_PREFIX = 'notepad_tab_';
        const ACTIVE_TAB_KEY = 'notepad_active_tab';

        // 現在アクティブなタブ番号（保存されていなければデフォルトは '1'）
        let currentTab = localStorage.getItem(ACTIVE_TAB_KEY) || '1';

        // 1. 初期化処理（ページ読み込み時に実行）
        window.addEventListener('DOMContentLoaded', () => {
            switchTab(currentTab);
        });

        // 2. 入力時の自動保存（現在選択中のタブに対応するキーに保存）
        textarea.addEventListener('input', () => {
            localStorage.setItem(STORAGE_PREFIX + currentTab, textarea.value);
        });

        // 3. 各タブボタンにクリックイベントを設定
        tabButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                const selectedTab = e.target.getAttribute('data-tab');
                switchTab(selectedTab);
            });
        });

        // タブを切り替える共通関数
        function switchTab(tabNumber) {
            currentTab = tabNumber;
            localStorage.setItem(ACTIVE_TAB_KEY, currentTab); // 開いているタブ番号を保存

            // ボタンの見た目を更新（アクティブなものに .active クラスをつける）
            tabButtons.forEach(button => {
                if (button.getAttribute('data-tab') === currentTab) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });

            // ローカルストレージから該当するタブのデータを読み込んでテキストエリアにセット
            const savedContent = localStorage.getItem(STORAGE_PREFIX + currentTab);
            textarea.value = savedContent !== null ? savedContent : '';
            
            // 切り替え後、すぐに文字を打てるようにフォーカスを合わせる
            textarea.focus();
        }
    </script>

</body>
</html>
